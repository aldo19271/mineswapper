<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mineswapper Mobile | Sentuh & Main</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            background: linear-gradient(145deg, #1a472a 0%, #0e2a1a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            margin: 0;
            padding: 12px;
        }

        .game-container {
            background: rgba(30, 20, 15, 0.4);
            backdrop-filter: blur(3px);
            border-radius: 48px;
            padding: 16px 12px 12px 12px;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }

        .game-panel {
            background: #2d211a;
            border-radius: 40px;
            padding: 16px;
        }

        .header-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1f1612;
            padding: 8px 16px;
            border-radius: 60px;
            margin-bottom: 16px;
            color: #f9e6cf;
            flex-wrap: wrap;
            gap: 8px;
        }

        .mine-counter, .flag-counter {
            background: #000000aa;
            backdrop-filter: blur(4px);
            padding: 6px 14px;
            border-radius: 32px;
            font-weight: bold;
            font-size: 1.2rem;
            font-family: monospace;
        }

        .reset-btn {
            background: #e0a82b;
            border: none;
            font-size: 1.6rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 3px 0 #8b5a2b;
        }

        .reset-btn:active {
            transform: translateY(2px);
        }

        .skin-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .skin-btn {
            background: #3e2a24;
            border: none;
            padding: 8px 14px;
            border-radius: 40px;
            font-weight: bold;
            color: #ffefcf;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .skin-btn.active {
            background: #f5b642;
            color: #2a180c;
        }

        /* ===== PERBAIKAN UTAMA: BOARD BISA SCROLL + SEL LEGA ===== */
        .board-wrapper {
            overflow-x: auto;
            overflow-y: visible;
            -webkit-overflow-scrolling: touch;
            border-radius: 24px;
        }

        .board {
            display: grid;
            gap: 5px;  /* JARAK ANTAR SEL = 5px (tidak dempet) */
            background-color: #50382a;
            padding: 10px;
            border-radius: 28px;
            min-width: min-content;
        }

        /* Ukuran sel: minimal 42px, bisa membesar jika layar lega */
        .cell {
            width: 42px;
            height: 42px;
            min-width: 42px;
            background: #b87c4f;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: inset 0 -2px 0 #6d3f1f, inset 0 2px 3px #ffdd99;
            font-family: monospace;
            transition: 0.05s linear;
        }

        /* Jika layar sangat sempit, sel tetap 42px (nyaman disentuh) */
        @media (max-width: 480px) {
            .cell {
                width: 40px;
                height: 40px;
                min-width: 40px;
                font-size: 1.1rem;
            }
        }

        /* Skin styles */
        .skin-classic .cell { background: #c6905b; }
        .skin-classic .cell.revealed { background: #ebd5b3; color: #4a2512; }

        .skin-ocean .cell { background: #3f92b0; box-shadow: inset 0 -2px 0 #1c5a70; }
        .skin-ocean .cell.revealed { background: #b6e2f0; color: #02455e; }

        .skin-forest .cell { background: #5f8742; }
        .skin-forest .cell.revealed { background: #cae6b2; color: #1d4900; }

        .skin-neon .cell { background: #2c2e6b; box-shadow: inset 0 -2px 0 #151747; }
        .skin-neon .cell.revealed { background: #dcddff; color: #2f00b3; text-shadow: 0 0 2px cyan; }

        .cell.flagged::before {
            content: "⚑";
            font-size: 1.5rem;
            display: block;
        }
        .cell.flagged { background: #cf9f6e; font-size: 0; }
        .cell.revealed.flagged::before { content: ""; }
        .cell.revealed { cursor: default; transform: scale(0.98); }
        .cell:active:not(.revealed) { transform: scale(0.95); }

        .message-area {
            text-align: center;
            margin-top: 14px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #ffe5b4;
        }
        footer {
            font-size: 0.65rem;
            text-align: center;
            margin-top: 12px;
            color: #d4bc8a;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="game-panel" id="gamePanel">
        <div class="header-stats">
            <div class="mine-counter">💣 <span id="minesLeft">0</span></div>
            <button class="reset-btn" id="resetGameBtn">🔄</button>
            <div class="flag-counter">🚩 <span id="flagsUsed">0</span></div>
        </div>
        <div class="skin-selector">
            <button class="skin-btn" data-skin="classic">🏔️ Klasik</button>
            <button class="skin-btn" data-skin="ocean">🌊 Samudra</button>
            <button class="skin-btn" data-skin="forest">🍃 Hutan</button>
            <button class="skin-btn" data-skin="neon">💜 Neon</button>
        </div>
        <div class="board-wrapper">
            <div id="boardContainer" class="board"></div>
        </div>
        <div class="message-area" id="gameMessage">✨ Tekan lama = bendera ✨</div>
        <footer>◉ Tekan biasa = buka | Tekan lama (½ detik) = bendera 🚩</footer>
    </div>
</div>

<script>
    (function(){
        // KONFIGURASI
        const ROWS = 12;
        const COLS = 14;
        const TOTAL_MINES = 35;

        let board = [];
        let gameActive = true;
        let firstMove = true;
        let flagsPlaced = 0;
        let pressTimer = null;
        let audioCtx = null;

        const boardDiv = document.getElementById('boardContainer');
        const minesLeftSpan = document.getElementById('minesLeft');
        const flagsUsedSpan = document.getElementById('flagsUsed');
        const resetBtn = document.getElementById('resetGameBtn');
        const messageDiv = document.getElementById('gameMessage');

        function initAudio() {
            if(audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        function playBeep(type) {
            if(!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now+0.4);
            if(type === 'reveal') { osc.frequency.value = 880; }
            else if(type === 'flag') { osc.frequency.value = 660; }
            else if(type === 'boom') { osc.type = 'sawtooth'; osc.frequency.value = 120; }
            else if(type === 'win') { osc.frequency.value = 523.25; osc.frequency.exponentialRampToValueAtTime(1046.5, now+0.5); }
            else { osc.frequency.value = 360; }
            osc.start();
            osc.stop(now+0.4);
        }
        function safePlay(type) {
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            playBeep(type);
        }

        function initEmptyBoard() {
            return Array(ROWS).fill().map(() => Array(COLS).fill().map(() => ({
                mine: false, revealed: false, flag: false, neighborMines: 0
            })));
        }

        function calcNeighbors(boardData) {
            for(let i=0;i<ROWS;i++){
                for(let j=0;j<COLS;j++){
                    if(boardData[i][j].mine) { boardData[i][j].neighborMines = -1; continue; }
                    let cnt = 0;
                    for(let di=-1;di<=1;di++){
                        for(let dj=-1;dj<=1;dj++){
                            if(di===0 && dj===0) continue;
                            const ni=i+di, nj=j+dj;
                            if(ni>=0 && ni<ROWS && nj>=0 && nj<COLS && boardData[ni][nj].mine) cnt++;
                        }
                    }
                    boardData[i][j].neighborMines = cnt;
                }
            }
        }

        function placeMinesExcluding(firstRow, firstCol) {
            let minesPlaced = 0;
            const newBoard = initEmptyBoard();
            while(minesPlaced < TOTAL_MINES) {
                const row = Math.floor(Math.random() * ROWS);
                const col = Math.floor(Math.random() * COLS);
                if((row === firstRow && col === firstCol)) continue;
                if(!newBoard[row][col].mine) {
                    newBoard[row][col].mine = true;
                    minesPlaced++;
                }
            }
            calcNeighbors(newBoard);
            return newBoard;
        }

        function revealCell(row, col) {
            if(!gameActive) return;
            const cell = board[row][col];
            if(cell.revealed || cell.flag) return;
            if(cell.mine) {
                cell.revealed = true;
                gameActive = false;
                messageDiv.innerHTML = "💥 BOOM! Kalah! Tekan reset 💥";
                safePlay('boom');
                revealAllMines();
                updateUI();
                return;
            }
            cell.revealed = true;
            safePlay('reveal');
            if(cell.neighborMines === 0) {
                for(let di=-1;di<=1;di++){
                    for(let dj=-1;dj<=1;dj++){
                        const ni=row+di, nj=col+dj;
                        if(ni>=0 && ni<ROWS && nj>=0 && nj<COLS && !board[ni][nj].revealed && !board[ni][nj].flag && !board[ni][nj].mine){
                            revealCell(ni,nj);
                        }
                    }
                }
            }
            updateUI();
            checkWin();
        }

        function toggleFlag(row, col) {
            if(!gameActive) return;
            const cell = board[row][col];
            if(cell.revealed) return;
            if(!cell.flag && flagsPlaced >= TOTAL_MINES) {
                messageDiv.innerHTML = "⚠️ Bendera maksimal! ⚠️";
                return;
            }
            if(!cell.flag) {
                cell.flag = true;
                flagsPlaced++;
                safePlay('flag');
                if(navigator.vibrate) navigator.vibrate(30);
            } else {
                cell.flag = false;
                flagsPlaced--;
                safePlay('reset');
            }
            updateUI();
            checkWin();
        }

        function revealAllMines() {
            for(let i=0;i<ROWS;i++)
                for(let j=0;j<COLS;j++)
                    if(board[i][j].mine) board[i][j].revealed = true;
        }

        function checkWin() {
            let allSafeRevealed = true;
            for(let i=0;i<ROWS;i++)
                for(let j=0;j<COLS;j++)
                    if(!board[i][j].mine && !board[i][j].revealed) allSafeRevealed = false;
            if(allSafeRevealed && gameActive) {
                gameActive = false;
                messageDiv.innerHTML = "🏆 SELAMAT! MENANG! 🎉";
                safePlay('win');
                updateUI();
            }
        }

        function updateUI() {
            let flagged = 0;
            for(let i=0;i<ROWS;i++)
                for(let j=0;j<COLS;j++)
                    if(board[i][j].flag) flagged++;
            flagsUsedSpan.innerText = flagged;
            minesLeftSpan.innerText = TOTAL_MINES - flagged;
            renderBoard();
        }

        let currentSkin = 'classic';
        function renderBoard() {
            const colCount = COLS;
            boardDiv.style.gridTemplateColumns = `repeat(${colCount}, minmax(42px, auto))`;
            boardDiv.innerHTML = '';
            for(let i=0;i<ROWS;i++){
                for(let j=0;j<COLS;j++){
                    const cell = board[i][j];
                    const cellDiv = document.createElement('div');
                    cellDiv.className = 'cell';
                    if(cell.revealed) cellDiv.classList.add('revealed');
                    if(cell.flag && !cell.revealed) cellDiv.classList.add('flagged');
                    if(cell.revealed) {
                        if(cell.mine) cellDiv.innerText = '💣';
                        else {
                            const val = cell.neighborMines;
                            cellDiv.innerText = val === 0 ? '' : val;
                            if(val===1) cellDiv.style.color = '#1f77b4';
                            else if(val===2) cellDiv.style.color = '#2c8c3e';
                            else if(val===3) cellDiv.style.color = '#d9534f';
                            else if(val>=4) cellDiv.style.color = '#b83d8f';
                        }
                    }
                    // Event sentuh mobile
                    (function(r,c){
                        cellDiv.addEventListener('touchstart', (e) => {
                            e.preventDefault();
                            pressTimer = setTimeout(() => {
                                if(gameActive && !firstMove && !board[r][c].revealed) {
                                    toggleFlag(r,c);
                                }
                                pressTimer = null;
                            }, 500);
                        });
                        cellDiv.addEventListener('touchend', (e) => {
                            e.preventDefault();
                            if(pressTimer) {
                                clearTimeout(pressTimer);
                                pressTimer = null;
                                if(gameActive) {
                                    if(firstMove) {
                                        firstMove = false;
                                        initAudio();
                                        safePlay('reset');
                                        board = placeMinesExcluding(r,c);
                                        gameActive = true;
                                        revealCell(r,c);
                                        updateUI();
                                        messageDiv.innerHTML = "🎮 Ayo bersihkan ranjau! 🎮";
                                    } else {
                                        if(!board[r][c].revealed && !board[r][c].flag) {
                                            revealCell(r,c);
                                        }
                                    }
                                }
                            }
                        });
                        cellDiv.addEventListener('touchcancel', (e) => {
                            if(pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
                        });
                        // Untuk mouse (debug desktop)
                        cellDiv.addEventListener('click', (e) => {
                            if(window.innerWidth > 768) {
                                if(firstMove) {
                                    firstMove=false; initAudio(); board=placeMinesExcluding(r,c); gameActive=true; revealCell(r,c); updateUI();
                                } else if(!board[r][c].revealed && !board[r][c].flag) revealCell(r,c);
                            }
                        });
                        cellDiv.addEventListener('contextmenu', (e) => {
                            e.preventDefault();
                            if(window.innerWidth > 768 && !firstMove && gameActive && !board[r][c].revealed) toggleFlag(r,c);
                        });
                    })(i,j);
                    boardDiv.appendChild(cellDiv);
                }
            }
            document.getElementById('gamePanel').classList.remove('skin-classic','skin-ocean','skin-forest','skin-neon');
            document.getElementById('gamePanel').classList.add(`skin-${currentSkin}`);
        }

        function resetGame() {
            gameActive = true;
            firstMove = true;
            flagsPlaced = 0;
            board = initEmptyBoard();
            calcNeighbors(board);
            messageDiv.innerHTML = "✨ Lahan baru! Tekan petak untuk mulai ✨";
            updateUI();
            safePlay('reset');
        }

        function setSkin(skinName) {
            currentSkin = skinName;
            const panel = document.getElementById('gamePanel');
            panel.classList.remove('skin-classic','skin-ocean','skin-forest','skin-neon');
            panel.classList.add(`skin-${skinName}`);
            document.querySelectorAll('.skin-btn').forEach(btn => {
                if(btn.getAttribute('data-skin') === skinName) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            renderBoard();
        }

        resetBtn.addEventListener('click', resetGame);
        document.querySelectorAll('.skin-btn').forEach(btn => {
            btn.addEventListener('click', () => setSkin(btn.getAttribute('data-skin')));
        });

        board = initEmptyBoard();
        calcNeighbors(board);
        gameActive = true;
        firstMove = true;
        setSkin('classic');
        updateUI();
        messageDiv.innerHTML = "🌱 Mineswapper Mobile! Tekan lama untuk bendera 🌱";

        document.body.addEventListener('touchstart', () => { if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); });
    })();
</script>
</body>
</html>
